<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalForge Tech | Custom Mobile Apps & Digital Solutions</title>
<meta name="impact-site-verification" value="80ed49c7-ca80-40b3-803c-bdbee121e1e5">
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel for JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0F172A',
              slate: '#1E293B',
              card: '#0F172A',
              border: '#334155',
              cyan: '#38BDF8',
              cyanHover: '#0284C7',
              accent: '#0EA5E9',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --whatsapp: #22c55e;
      --whatsapp-hover: #16a34a;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0F172A;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #38BDF8;
    }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-100 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const PIPELINE_STAGES = [
      { id: 'New Lead', label: 'New Lead', color: 'border-cyan-500/50 bg-cyan-500/10 text-cyan-400' },
      { id: 'Contacted', label: 'Contacted', color: 'border-blue-500/50 bg-blue-500/10 text-blue-400' },
      { id: 'Meeting Scheduled', label: 'Meeting Scheduled', color: 'border-amber-500/50 bg-amber-500/10 text-amber-400' },
      { id: 'Proposal Sent', label: 'Proposal Sent', color: 'border-purple-500/50 bg-purple-500/10 text-purple-400' },
      { id: 'Closed Won', label: 'Closed Won', color: 'border-emerald-500/50 bg-emerald-500/10 text-emerald-400' },
      { id: 'Closed Lost', label: 'Closed Lost', color: 'border-rose-500/50 bg-rose-500/10 text-rose-400' }
    ];

    const INDUSTRIES = ['Education', 'Healthcare', 'Retail', 'Gym & Fitness', 'Real Estate', 'Services', 'Hospitality', 'Other'];
    const SOURCES = ['Cold Visit', 'Instagram DM', 'WhatsApp Outreach', 'Referral', 'LinkedIn', 'Google Business'];

    const SAMPLE_LEADS = [
      { id: 'lead-1', businessName: 'Jind Fitness Hub', contactPerson: 'Rahul Sharma', phone: '9812345678', industry: 'Gym & Fitness', status: 'Proposal Sent', source: 'Cold Visit', value: '35000', nextFollowUp: '2026-10-20', notes: 'Requested custom member attendance & workout tracking app.' },
      { id: 'lead-2', businessName: 'Haryana Global Academy', contactPerson: 'Dr. V. K. Verma', phone: '9416012345', industry: 'Education', status: 'Meeting Scheduled', source: 'Referral', value: '75000', nextFollowUp: '2026-10-18', notes: 'School fee collection portal and student ID app demo.' }
    ];

    const SAMPLE_LOGS = [
      { id: 'log-1', leadId: 'lead-1', type: 'In-Person Meeting', summary: 'Met at gym, discussed integration requirements.', date: '2026-10-12' }
    ];

    function App() {
      const [viewMode, setViewMode] = useState('website'); // 'website' or 'crm'

      // CRM Authentication state
      const [isAuthenticated, setIsAuthenticated] = useState(() => {
        return sessionStorage.getItem('localforge_crm_auth') === 'true';
      });
      const [passwordInput, setPasswordInput] = useState('');
      const [authError, setAuthError] = useState('');
      const MASTER_PASSWORD = 'Admin@2001';

      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === MASTER_PASSWORD) {
          sessionStorage.setItem('localforge_crm_auth', 'true');
          setIsAuthenticated(true);
          setAuthError('');
        } else {
          setAuthError('Invalid Access Key. Please try again.');
        }
      };

      const handleLogout = () => {
        sessionStorage.removeItem('localforge_crm_auth');
        setIsAuthenticated(false);
      };

      const [leads, setLeads] = useState(() => {
        const saved = localStorage.getItem('localforge_crm_leads');
        return saved ? JSON.parse(saved) : SAMPLE_LEADS;
      });

      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('localforge_crm_logs');
        return saved ? JSON.parse(saved) : SAMPLE_LOGS;
      });

      useEffect(() => {
        localStorage.setItem('localforge_crm_leads', JSON.stringify(leads));
      }, [leads]);

      useEffect(() => {
        localStorage.setItem('localforge_crm_logs', JSON.stringify(logs));
      }, [logs]);

      const [activeTab, setActiveTab] = useState('kanban');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedIndustry, setSelectedIndustry] = useState('All');
      const [selectedStatus, setSelectedStatus] = useState('All');

      const [isAddLeadOpen, setIsAddLeadOpen] = useState(false);
      const [editingLead, setEditingLead] = useState(null);
      const [activeLogLead, setActiveLogLead] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const metrics = useMemo(() => {
        const totalLeads = leads.length;
        const activeDeals = leads.filter(l => l.status !== 'Closed Won' && l.status !== 'Closed Lost').length;
        const totalPipelineValue = leads
          .filter(l => l.status !== 'Closed Lost')
          .reduce((sum, l) => sum + (Number(l.value) || 0), 0);
        const wonCount = leads.filter(l => l.status === 'Closed Won').length;
        const conversionRate = totalLeads > 0 ? ((wonCount / totalLeads) * 100).toFixed(1) : '0';

        return { totalLeads, activeDeals, totalPipelineValue, conversionRate };
      }, [leads]);

      const filteredLeads = useMemo(() => {
        return leads.filter(lead => {
          const matchesSearch = lead.businessName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                lead.contactPerson.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                lead.phone.includes(searchQuery);
          const matchesIndustry = selectedIndustry === 'All' || lead.industry === selectedIndustry;
          const matchesStatus = selectedStatus === 'All' || lead.status === selectedStatus;
          return matchesSearch && matchesIndustry && matchesStatus;
        });
      }, [leads, searchQuery, selectedIndustry, selectedStatus]);

      const handleSaveLead = (leadData) => {
        if (leadData.id) {
          setLeads(prev => prev.map(l => l.id === leadData.id ? leadData : l));
        } else {
          const newLead = {
            ...leadData,
            id: 'lead-' + Date.now(),
            createdAt: new Date().toISOString().split('T')[0]
          };
          setLeads(prev => [newLead, ...prev]);
        }
        setIsAddLeadOpen(false);
        setEditingLead(null);
      };

      const handleDeleteLead = (id) => {
        setLeads(prev => prev.filter(l => l.id !== id));
        setLogs(prev => prev.filter(log => log.leadId !== id));
      };

      const handleUpdateLeadStatus = (leadId, newStatus) => {
        setLeads(prev => prev.map(l => l.id === leadId ? { ...l, status: newStatus } : l));
      };

      const handleAddLog = (leadId, logData) => {
        const newLog = {
          id: 'log-' + Date.now(),
          leadId,
          ...logData,
          date: new Date().toISOString().split('T')[0]
        };
        setLogs(prev => [newLog, ...prev]);
      };

      const handleExportData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ leads, logs }, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `localforge_crm_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const getWhatsAppLink = (phone, businessName) => {
        const cleanPhone = phone.replace(/\D/g, '');
        const message = encodeURIComponent(`Hello ${businessName}, this is LocalForge Tech regarding your software & web platform query.`);
        return `https://wa.me/${cleanPhone.startsWith('91') ? cleanPhone : '91' + cleanPhone}?text=${message}`;
      };

      if (viewMode === 'website') {
        return (
          <div className="min-h-screen bg-[#0f172a] text-slate-100 flex flex-col justify-between">
            {/* Header */}
            <header className="flex justify-between items-center p-4 md:px-8 max-w-7xl mx-auto w-full">
              <div className="flex items-center gap-4 cursor-pointer" onClick={() => setViewMode('website')}>
                <div className="w-full max-w-[280px] md:max-w-[360px] h-16 md:h-20 flex items-center justify-start p-1 overflow-hidden">
                  <img 
                    src="logo.png" 
                    alt="LocalForge Tech Logo" 
                    className="w-full h-full object-contain filter drop-shadow-[0_0_12px_rgba(56,189,248,0.25)]"
                    onError={(e) => {
                      e.target.style.display = 'none';
                      e.target.nextSibling.style.display = 'flex';
                    }}
                  />
                  <div className="hidden items-center gap-2">
                    <i data-lucide="cpu" className="w-8 h-8 text-cyan-400"></i>
                    <span className="font-extrabold text-xl text-white tracking-wider">LOCALFORGE TECH</span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2.5">
                <button
                  onClick={() => setViewMode('crm')}
                  className="bg-purple-600 hover:bg-purple-500 text-white px-3.5 py-2 rounded-lg font-semibold text-xs transition flex items-center gap-1.5 shadow-lg shadow-purple-600/20 border border-purple-500/40"
                >
                  <i data-lucide="lock" className="w-3.5 h-3.5"></i> CRM Portal
                </button>
                <a href="tel:+918708145865" className="bg-[#38bdf8] text-[#0f172a] px-3.5 py-2 rounded-lg font-semibold text-xs transition hover:bg-[#0284c7] hover:text-white flex items-center gap-1.5">
                  📞 Call Us
                </a>
                <a href="https://wa.me/918708145865" target="_blank" rel="noreferrer" className="bg-[#22c55e] text-white px-3.5 py-2 rounded-lg font-semibold text-xs transition hover:bg-[#16a34a] flex items-center gap-1.5">
                  💬 WhatsApp
                </a>
              </div>
            </header>

            {/* Hero Section */}
            <section className="text-center py-10 px-4 max-w-5xl mx-auto my-auto">
              <div className="w-full max-w-xl md:max-w-2xl mx-auto mb-8 p-4 rounded-2xl bg-slate-900/80 border border-cyan-500/30 shadow-2xl shadow-cyan-500/20 backdrop-blur ring-1 ring-cyan-500/30">
                <img 
                  src="logo.png" 
                  alt="LocalForge Tech Brand" 
                  className="w-full h-auto object-contain max-h-48 md:max-h-64 mx-auto drop-shadow-[0_0_25px_rgba(56,189,248,0.3)]"
                  onError={(e) => {
                    e.target.style.display = 'none';
                    e.target.nextSibling.style.display = 'block';
                  }}
                />
                <i data-lucide="cpu" className="w-20 h-20 text-cyan-400 hidden mx-auto"></i>
              </div>

              <h1 className="text-3xl md:text-5xl font-extrabold mb-4 tracking-tight leading-tight">
                Empowering Local Businesses with Custom Apps & Software
              </h1>
              <p className="text-slate-400 text-base md:text-lg mb-8 max-w-2xl mx-auto">
                We build tailored mobile apps, custom customer management portals, and modern web platforms designed to help local organizations in Jind grow and automate operations.
              </p>
              <div className="flex justify-center gap-4 flex-wrap">
                <a href="tel:+918708145865" className="bg-[#38bdf8] text-[#0f172a] px-6 py-3 rounded-xl font-bold transition hover:bg-[#0284c7] hover:text-white shadow-lg shadow-cyan-500/20">
                  Call: +91 8708145865
                </a>
                <a href="https://wa.me/918708145865" target="_blank" rel="noreferrer" className="bg-[#22c55e] text-white px-6 py-3 rounded-xl font-bold transition hover:bg-[#16a34a]">
                  Chat on WhatsApp
                </a>
              </div>
            </section>

            {/* Features */}
            <section className="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-6xl mx-auto px-4 py-8 w-full">
              <div className="bg-[#1e293b] p-6 rounded-2xl border border-slate-700/85 shadow-md">
                <h3 className="text-[#38bdf8] font-bold text-lg mb-2 flex items-center gap-2">
                  <i data-lucide="smartphone" className="w-5 h-5"></i> Custom Mobile Apps
                </h3>
                <p className="text-slate-400 text-sm">
                  Android and iOS applications engineered to bring customer loyalty, booking, and ordering directly to your clients' phones.
                </p>
              </div>

              <div className="bg-[#1e293b] p-6 rounded-2xl border border-slate-700/85 shadow-md">
                <h3 className="text-[#38bdf8] font-bold text-lg mb-2 flex items-center gap-2">
                  <i data-lucide="globe" className="w-5 h-5"></i> Business Websites
                </h3>
                <p className="text-slate-400 text-sm">
                  Lightning-fast, mobile-friendly landing pages and digital storefronts optimized for local search visibility and conversion.
                </p>
              </div>

              <div className="bg-[#1e293b] p-6 rounded-2xl border border-slate-700/85 shadow-md">
                <h3 className="text-[#38bdf8] font-bold text-lg mb-2 flex items-center gap-2">
                  <i data-lucide="cpu" className="w-5 h-5"></i> Workflow Automation
                </h3>
                <p className="text-slate-400 text-sm">
                  Tailored internal tools, inventory dashboards, and CRM integrations to save time and reduce manual workload.
                </p>
              </div>
            </section>

            {/* Contact Callout */}
            <section className="text-center py-12 px-4 bg-[#111827] mt-12 border-t border-slate-800">
              <h2 className="text-2xl font-bold mb-3">Ready to transform your business digitally?</h2>
              <p className="text-slate-400 mb-6 max-w-xl mx-auto text-sm">
                Let's discuss how LocalForge Tech can build the right tools for your business.
              </p>
              <div className="flex justify-center gap-4 flex-wrap">
                <a href="tel:+918708145865" className="bg-[#38bdf8] text-[#0f172a] px-5 py-2.5 rounded-xl font-bold text-sm">📞 Call Us</a>
                <a href="https://wa.me/918708145865" target="_blank" rel="noreferrer" className="bg-[#22c55e] text-white px-5 py-2.5 rounded-xl font-bold text-sm">💬 WhatsApp Us</a>
                <a href="mailto:localforgetech@gmail.com" className="bg-slate-700 text-white px-5 py-2.5 rounded-xl font-bold text-sm">✉️ Email Us</a>
              </div>
            </section>

            {/* Footer */}
            <footer className="text-center py-6 text-slate-500 text-xs border-t border-slate-800/80 flex flex-col sm:flex-row items-center justify-center gap-4">
              <span>&copy; 2026 LocalForge Tech. All rights reserved. | Huda Market, Jind, Haryana</span>
              <button 
                onClick={() => setViewMode('crm')}
                className="text-cyan-400 hover:underline font-mono text-[11px]"
              >
                🔐 Open Secure CRM Dashboard
              </button>
            </footer>
          </div>
        );
      }

      if (!isAuthenticated) {
        return (
          <div className="min-h-screen bg-[#080C14] flex items-center justify-center p-4">
            <div className="bg-[#0F172A] border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-full max-w-sm mx-auto p-3 rounded-xl bg-slate-900/80 border border-cyan-500/30 shadow-lg shadow-cyan-500/15 mb-4">
                  <img 
                    src="logo.png" 
                    alt="LocalForge Tech Logo" 
                    className="w-full h-auto object-contain max-h-32 mx-auto"
                    onError={(e) => {
                      e.target.style.display = 'none';
                      e.target.nextSibling.style.display = 'block';
                    }}
                  />
                  <i data-lucide="lock" className="w-12 h-12 text-cyan-400 hidden mx-auto"></i>
                </div>
                <h1 className="text-2xl font-black text-white tracking-wider">LOCALFORGE CRM</h1>
                <p className="text-xs text-slate-400">Restricted Access Studio Portal</p>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                {authError && (
                  <div className="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3 rounded-lg text-center">
                    {authError}
                  </div>
                )}
                <div>
                  <label className="block text-xs text-slate-400 mb-1">Access Key / Password</label>
                  <input
                    type="password"
                    required
                    placeholder="Enter CRM Password"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    className="w-full bg-[#080C14] border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-cyan-500"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-lg text-sm transition shadow-lg shadow-cyan-500/20"
                >
                  Authenticate Portal
                </button>
              </form>

              <div className="text-center pt-2">
                <button
                  onClick={() => setViewMode('website')}
                  className="text-xs text-slate-400 hover:text-cyan-400 transition"
                >
                  ← Return to Public Website
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#080C14] text-slate-100 flex flex-col md:flex-row">
          {/* Sidebar Navigation */}
          <aside className="w-full md:w-64 bg-[#0F172A] border-b md:border-b-0 md:border-r border-slate-800 flex-shrink-0 flex flex-col justify-between">
            <div>
              <div className="p-4 border-b border-slate-800/80 flex flex-col items-center gap-2">
                <div className="w-full max-w-[240px] h-16 flex items-center justify-center p-1 overflow-hidden">
                  <img 
                    src="logo.png" 
                    alt="LocalForge Tech Logo" 
                    className="w-full h-full object-contain"
                    onError={(e) => {
                      e.target.style.display = 'none';
                      e.target.nextSibling.style.display = 'flex';
                    }}
                  />
                  <div className="hidden items-center gap-2">
                    <i data-lucide="cpu" className="w-7 h-7 text-cyan-400"></i>
                    <span className="font-black text-base text-white tracking-wider">LOCALFORGE</span>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <span className="inline-block text-cyan-400 text-[10px] font-bold px-2 py-0.5 rounded bg-cyan-950 border border-cyan-800">CRM STUDIO</span>
                  <p className="text-[11px] text-slate-400">Jind Operations</p>
                </div>
              </div>

              <nav className="p-3 space-y-1">
                <button
                  onClick={() => setActiveTab('overview')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                    activeTab === 'overview' ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                  }`}
                >
                  <i data-lucide="layout-dashboard" className="w-4 h-4"></i>
                  Overview & Stats
                </button>

                <button
                  onClick={() => setActiveTab('kanban')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                    activeTab === 'kanban' ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                  }`}
                >
                  <i data-lucide="kanban" className="w-4 h-4"></i>
                  Pipeline Board
                </button>

                <button
                  onClick={() => setActiveTab('directory')}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${
                    activeTab === 'directory' ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                  }`}
                >
                  <i data-lucide="users" className="w-4 h-4"></i>
                  Client Directory
                </button>
              </nav>
            </div>

            <div className="p-4 border-t border-slate-800 bg-[#0B1120] text-xs text-slate-400 flex flex-col gap-2">
              <button
                onClick={() => setViewMode('website')}
                className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 text-xs font-medium transition mb-1 border border-cyan-500/30"
              >
                <i data-lucide="globe" className="w-3.5 h-3.5"></i> Visit Public Website
              </button>
              <button
                onClick={handleExportData}
                className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium transition mb-1 border border-slate-700"
              >
                <i data-lucide="download" className="w-3.5 h-3.5 text-cyan-400"></i> Export CRM Backup
              </button>
              <button
                onClick={handleLogout}
                className="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs font-medium transition mb-1 border border-rose-500/30"
              >
                <i data-lucide="log-out" className="w-3.5 h-3.5"></i> Lock Portal
              </button>
              <div className="flex items-center justify-between text-slate-300">
                <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Systems Active</span>
                <span className="font-mono text-[10px] text-cyan-400">v2.8</span>
              </div>
            </div>
          </aside>

          {/* Main Workspace */}
          <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
            {/* Top Bar */}
            <header className="bg-[#0F172A]/80 backdrop-blur sticky top-0 z-20 border-b border-slate-800 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <h2 className="text-xl font-bold text-white capitalize">
                  {activeTab === 'overview' && 'Executive Dashboard'}
                  {activeTab === 'kanban' && 'Lead Pipeline Board'}
                  {activeTab === 'directory' && 'Client Directory & Logs'}
                </h2>
                <p className="text-xs text-slate-400">Direct WhatsApp Outreach & Deal Tracker</p>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => { setEditingLead(null); setIsAddLeadOpen(true); }}

    function LeadModal({ lead, onClose, onSave }) {

        businessName: '',
        contactPerson: '',
        phone: '',
        industry: 'Education',
        status: 'New Lead',
        source: 'Cold Visit',
        value: '',
        nextFollowUp: '',
        notes: ''
      });

      const [errorMsg, setErrorMsg] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.businessName || !formData.phone) {
          setErrorMsg('Please complete both Business Name and Phone field.');
          return;
        }
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#0F172A] border border-slate-800 w-full max-w-lg rounded-xl shadow-2xl overflow-hidden flex flex-col">

            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs overflow-y-auto max-h-[80vh]">

                <div className="p-2.5 rounded bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs">

              )}

              <div>
                <label className="block text-slate-400 mb-1">Business / Firm Name *</label>

                  placeholder="e.g. Jind Fitness Club"

                  onChange={e => setFormData({ ...formData, businessName: e.target.value })}

                  <label className="block text-slate-400 mb-1">Contact Person</label>

                    type="text"

                    onChange={e => setFormData({ ...formData, contactPerson: e.target.value })}

                <div>
                  <label className="block text-slate-400 mb-1">WhatsApp / Phone *</label>
                  <input
                    type="text"
                    required
                    placeholder="9812345678"

                    onChange={e => setFormData({ ...formData, phone: e.target.value })}

                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 mb-1">Industry</label>
                  <select
                    value={formData.industry}
                    onChange={e => setFormData({ ...formData, industry: e.target.value })}

                  >

                <div>

                    {SOURCES.map(s => <option key={s} value={s}>{s}</option>)}

                <div>
                  <label className="block text-slate-400 mb-1">Estimated Value (₹)</label>

                    type="number"

    function ActivityLogModal({ lead, logs, onClose, onAddLog }) {
      const [type, setType] = useState('In-Person Meeting');
      const [summary, setSummary] = useState('');

        e.preventDefault();
        if (!summary.trim()) return;
        onAddLog({ type, summary });
        setSummary('');
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#0F172A] border border-slate-800 w-full max-w-md rounded-xl shadow-2xl overflow-hidden flex flex-col">
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <div>
                <h3 className="font-bold text-slate-100">{lead.businessName}</h3>
                <p className="text-xs text-slate-400">Interaction & Call History</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
            </div>

            <div className="p-4 space-y-4 text-xs overflow-y-auto max-h-[60vh]">
              <form onSubmit={handleAdd} className="space-y-2 bg-[#080C14] p-3 rounded-lg border border-slate-800">
                <div className="flex items-center justify-between gap-2">
                  <span className="font-semibold text-slate-300">Log New Interaction:</span>
                  <select
                    value={type}
                    onChange={e => setType(e.target.value)}
                    className="bg-[#0F1F2A] border border-slate-700 rounded px-2 py-1 text-slate-200"
                  >
                    <option value="In-Person Meeting">In-Person Meeting</option>
                    <option value="WhatsApp">WhatsApp Chat</option>
                    <option value="Phone Call">Phone Call</option>
                    <option value="Email">Email</option>
                  </select>
                </div>
                <textarea
                  rows="2"
                  placeholder="Summary of meeting or decision..."
                  value={summary}
                  onChange={e => setSummary(e.target.value)}
                  className="w-full bg-[#0F172A] border border-slate-700 rounded p-2 text-slate-200 focus:outline-none"
                ></textarea>
                <button
                  type="submit"
                  className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-1.5 rounded transition"
                >
                  Record Entry
                </button>
              </form>

              <div className="space-y-2">
                <h4 className="font-semibold text-slate-400 text-[11px] uppercase tracking-wider">History</h4>
                {logs.length === 0 ? (
                  <p className="text-slate-500 italic text-center py-4">No activity logged yet.</p>
                ) : (
                  logs.map(log => (
                    <div key={log.id} className="p-2.5 bg-[#080C14] border border-slate-800 rounded-lg space-y-1">
                      <div className="flex items-center justify-between text-slate-400">
                        <span className="font-semibold text-cyan-400">{log.type}</span>
                        <span className="font-mono text-[10px]">{log.date}</span>
                      </div>
                      <p className="text-slate-300">{log.summary}</p>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
