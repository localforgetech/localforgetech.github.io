<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalForge Tech Hub & CRMs</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // State to switch between CRMs: 'main' (your original CRM) or 'license' (the new License CRM)
            const [activeCRM, setActiveCRM] = React.useState('main');

            // --- License CRM State ---
            const [licenses, setLicenses] = React.useState([
                { id: 1, client: "Rahul Sharma", app: "LocalForge POS", key: "LF-9X2K-4M8P-7Q1W", status: "Active", phone: "919876543210", expiry: "2027-10-25" },
                { id: 2, client: "Aman Verma", app: "LocalForge Billing", key: "LF-3B5N-8V6C-2X9Z", status: "Pending", phone: "918708145865", expiry: "2026-11-15" }
            ]);
            const [requests, setRequests] = React.useState([
                { id: 101, client: "Vikram Singh", app: "LocalForge POS", phone: "919123456789", time: "2 mins ago" }
            ]);
            const [newClient, setNewClient] = React.useState("");
            const [newPhone, setNewPhone] = React.useState("");
            const [selectedApp, setSelectedApp] = React.useState("LocalForge POS");

            // --- Main Website CRM State (Placeholder for your existing client/project CRM) ---
            const [mainClients, setMainClients] = React.useState([
                { id: 1, name: "City Supermarket", project: "Custom POS App", status: "In Progress", value: "₹45,000" },
                { id: 2, name: "Apex Logistics", project: "Inventory Tracker", status: "Completed", value: "₹30,000" }
            ]);

            const generateKey = (clientName, phone) => {
                const randomPart = Math.random().toString(36).substring(2, 6).toUpperCase();
                const key = `LF-${Math.floor(1000 + Math.random() * 9000)}-${randomPart}-${Math.floor(1000 + Math.random() * 9000)}`;
                
                const newLicense = {
                    id: Date.now(),
                    client: clientName || "Direct Client",
                    app: selectedApp,
                    key: key,
                    status: "Active",
                    phone: phone || "910000000000",
                    expiry: new Date(Date.now() + 365*24*60*60*1000).toISOString().split('T')[0]
                };

                setLicenses([newLicense, ...licenses]);
                if (phone) {
                    const message = encodeURIComponent(`Hello ${clientName}! Your license key for ${selectedApp} is: ${key}. Valid until ${newLicense.expiry}. - LocalForge Tech`);
                    window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
                }
            };

            const fulfillRequest = (req) => {
                generateKey(req.client, req.phone);
                setRequests(requests.filter(r => r.id !== req.id));
            };

            return (
                <div className="max-w-7xl mx-auto p-6">
                    {/* Top Navigation & CRM Switcher Header */}
                    <header className="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-4 gap-4">
                        <div>
                            <h1 className="text-2xl font-bold text-indigo-400">LocalForge Tech Hub</h1>
                            <p className="text-sm text-slate-400">Central Management Portal for Business & Software Licenses</p>
                        </div>
                        
                        {/* CRM Switcher Buttons */}
                        <div className="flex bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                            <button 
                                onClick={() => setActiveCRM('main')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeCRM === 'main' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                                📂 Main Client CRM
                            </button>
                            <button 
                                onClick={() => setActiveCRM('license')}
                                className={`px-4 py-2 rounded-lg text-sm font-medium transition ${activeCRM === 'license' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                                🔑 License & WhatsApp CRM
                            </button>
                        </div>
                    </header>

                    {/* VIEW 1: MAIN WEBSITE CRM */}
                    {activeCRM === 'main' && (
                        <div>
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-xl font-semibold text-slate-200">Client Projects & Inquiries</h2>
                                <span className="text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded text-indigo-300">Active Clients: {mainClients.length}</span>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b border-slate-800 text-xs text-slate-400 uppercase bg-slate-950/50">
                                            <th className="p-3">Client / Organization</th>
                                            <th className="p-3">Project Type</th>
                                            <th className="p-3">Status</th>
                                            <th className="p-3">Project Value</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800 text-sm">
                                        {mainClients.map(c => (
                                            <tr key={c.id} className="hover:bg-slate-800/50 transition">
                                                <td className="p-3 font-medium text-slate-200">{c.name}</td>
                                                <td className="p-3 text-slate-400">{c.project}</td>
                                                <td className="p-3">
                                                    <span className={`px-2 py-1 rounded text-xs border ${c.status === 'Completed' ? 'bg-emerald-950 text-emerald-400 border-emerald-800' : 'bg-amber-950 text-amber-400 border-amber-800'}`}>
                                                        {c.status}
                                                    </span>
                                                </td>
                                                <td className="p-3 font-semibold text-indigo-300">{c.value}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* VIEW 2: LICENSE KEY & WHATSAPP CRM */}
                    {activeCRM === 'license' && (
                        <div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                                <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-lg">
                                    <h3 className="text-slate-400 text-sm font-medium">Total Active Licenses</h3>
                                    <p className="text-3xl font-bold mt-2 text-indigo-400">{licenses.filter(l => l.status === 'Active').length}</p>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-lg">
                                    <h3 className="text-slate-400 text-sm font-medium">Pending WhatsApp Requests</h3>
                                    <p className="text-3xl font-bold mt-2 text-amber-400">{requests.length}</p>
                                </div>
                                <div className="bg-slate-900 border border-slate-800 p-5 rounded-xl shadow-lg">
                                    <h3 className="text-slate-400 text-sm font-medium">Quick Generate Key</h3>
                                    <div className="mt-3 flex gap-2">
                                        <input 
                                            type="text" 
                                            placeholder="Client Name" 
                                            value={newClient} 
                                            onChange={(e) => setNewClient(e.target.value)}
                                            className="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-sm w-1/2 text-slate-200"
                                        />
                                        <input 
                                            type="text" 
                                            placeholder="Phone (91...)" 
                                            value={newPhone} 
                                            onChange={(e) => setNewPhone(e.target.value)}
                                            className="bg-slate-950 border border-slate-700 rounded px-2 py-1 text-sm w-1/2 text-slate-200"
                                        />
                                    </div>
                                    <button 
                                        onClick={() => { generateKey(newClient, newPhone); setNewClient(""); setNewPhone(""); }}
                                        className="mt-3 w-full bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold py-2 rounded transition">
                                        Issue & Send via WhatsApp
                                    </button>
                                </div>
                            </div>

                            {requests.length > 0 && (
                                <div className="mb-8 bg-amber-950/20 border border-amber-900/50 p-4 rounded-xl">
                                    <h2 className="text-lg font-semibold text-amber-400 mb-3">🔔 Incoming WhatsApp License Requests</h2>
                                    <div className="space-y-3">
                                        {requests.map(req => (
                                            <div key={req.id} className="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-800">
                                                <div>
                                                    <p className="font-semibold text-slate-200">{req.client} <span className="text-xs text-slate-400">({req.phone})</span></p>
                                                    <p className="text-xs text-slate-500">Requested {req.app} • {req.time}</p>
                                                </div>
                                                <button 
                                                    onClick={() => fulfillRequest(req)}
                                                    className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded text-sm font-medium transition">
                                                    Fulfill & Send Key 💬
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                                <div className="p-4 border-b border-slate-800 font-semibold text-slate-200">Issued License Database</div>
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="border-b border-slate-800 text-xs text-slate-400 uppercase bg-slate-950/50">
                                            <th className="p-3">Client</th>
                                            <th className="p-3">App Name</th>
                                            <th className="p-3">License Key</th>
                                            <th className="p-3">Expiry</th>
                                            <th className="p-3">Status</th>
                                            <th className="p-3 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800 text-sm">
                                        {licenses.map(lic => (
                                            <tr key={lic.id} className="hover:bg-slate-800/50 transition">
                                                <td className="p-3 font-medium text-slate-200">{lic.client}</td>
                                                <td className="p-3 text-slate-400">{lic.app}</td>
                                                <td className="p-3 font-mono text-indigo-300">{lic.key}</td>
                                                <td className="p-3 text-slate-400">{lic.expiry}</td>
                                                <td className="p-3">
                                                    <span className="px-2 py-1 rounded text-xs bg-emerald-950 text-emerald-400 border border-emerald-800">{lic.status}</span>
                                                </td>
                                                <td className="p-3 text-right">
                                                    <button 
                                                        onClick={() => {
                                                            const msg = encodeURIComponent(`Hello ${lic.client}, your license key is: ${lic.key}`);
                                                            window.open(`https://wa.me/${lic.phone}?text=${msg}`, '_blank');
                                                        }}
                                                        className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded transition">
                                                        Resend WhatsApp 💬
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
