          sessionStorage.removeItem('localforge_crm_auth');

        try {

          return SAMPLE_LEADS;
        }

        try {
          const saved = localStorage.getItem('localforge_crm_logs');
          return saved ? JSON.parse(saved) : SAMPLE_LOGS;
        } catch {
          return SAMPLE_LOGS;
        }

        const wonCount = leads.filter(l => l.status === 'Closed Won').length;
        const conversionRate = totalLeads > 0 ? ((wonCount / totalLeads) * 100).toFixed(1) : '0';

        return { totalLeads, activeDeals, totalPipelineValue, conversionRate };

          businessName: leadData.businessName.replace(/<[^>]*>?/gm, ''),
          contactPerson: leadData.contactPerson.replace(/<[^>]*>?/gm, ''),
          phone: leadData.phone.replace(/\D/g, ''),
          notes: leadData.notes.replace(/<[^>]*>?/gm, '')

          setLeads(prev => prev.map(l => l.id === sanitizedData.id ? sanitizedData : l));
        } else {
          const newLead = {
            ...sanitizedData,
            id: 'lead-' + Date.now(),
            createdAt: new Date().toISOString().split('T')[0]

          setLeads(prev => [newLead, ...prev]);

                            <div className="flex items-center justify-between">
                              <span className="font-semibold text-slate-200">{lead.businessName}</span>
                              <span className={`font-mono text-[10px] px-1.5 py-0.5 rounded ${isOverdue ? 'bg-rose-500/20 text-rose-400' : 'bg-slate-800 text-slate-400'}`}>
                                {lead.nextFollowUp}
                              </span>
                            </div>
                            <p className="text-slate-400 line-clamp-1">{lead.notes || 'No notes added.'}</p>
                            <div className="pt-1 flex items-center gap-2">
                              <a
                                href={`tel:${lead.phone}`}
                                className="text-[11px] text-cyan-400 flex items-center gap-1 hover:underline"
                              >
                                <i data-lucide="phone" className="w-3 h-3"></i> Call Owner
                              </a>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* View Tab 2: Kanban Pipeline */}
              {activeTab === 'kanban' && (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-4 overflow-x-auto pb-4">
                  {PIPELINE_STAGES.map(stage => {
                    const stageLeads = filteredLeads.filter(l => l.status === stage.id);
                    const stageTotal = stageLeads.reduce((sum, l) => sum + (Number(l.value) || 0), 0);

                    return (
                      <div key={stage.id} className="bg-[#0C1220] border border-slate-800/80 rounded-xl flex flex-col max-h-[75vh]">
                        <div className="p-3 border-b border-slate-800 flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <span className={`text-xs px-2 py-0.5 rounded font-semibold border ${stage.color}`}>
                              {stage.label}
                            </span>
                            <span className="text-xs text-slate-500">({stageLeads.length})</span>
                          </div>
                          <span className="text-xs font-mono text-slate-400">₹{(stageTotal/1000).toFixed(0)}k[cite: 1]</span>
                        </div>

                        <div className="p-3 space-y-3 overflow-y-auto flex-1">
                          {stageLeads.length === 0 ? (
                            <div className="text-center py-8 text-xs text-slate-600 border border-dashed border-slate-800/60 rounded-lg">
                              No deals here
                            </div>
                          ) : (
                            stageLeads.map(lead => (
                              <div
                                key={lead.id}
                                className="bg-[#0F172A] border border-slate-800 hover:border-slate-700 rounded-xl p-3 shadow-sm hover:shadow-cyan-500/5 transition space-y-2.5"
                              >
                                <div className="flex items-start justify-between gap-2">
                                  <h4 className="font-semibold text-slate-200 text-sm">{lead.businessName}</h4>
                                  <button
                                    onClick={() => { setEditingLead(lead); setIsAddLeadOpen(true); }}
                                    className="text-slate-500 hover:text-cyan-400 p-0.5"
                                  >
                                    <i data-lucide="edit-3" className="w-3.5 h-3.5"></i>
                                  </button>
                                </div>

                                <div className="text-xs text-slate-400 space-y-1">
                                  <p className="flex items-center gap-1">
                                    <i data-lucide="user" className="w-3 h-3 text-slate-500"></i> {lead.contactPerson}
                                  </p>
                                  <p className="flex items-center gap-1 font-mono text-emerald-400 font-semibold">
                                    <i data-lucide="indian-rupee" className="w-3 h-3"></i> {(Number(lead.value) || 0).toLocaleString('en-IN')}[cite: 1]
                                  </p>
                                </div>

                                {lead.notes && (
                                  <p className="text-[11px] text-slate-400 bg-[#080C14] p-2 rounded border border-slate-800 line-clamp-2">
                                    {lead.notes}
                                  </p>
                                )}

                                <div className="pt-2 border-t border-slate-800 flex items-center justify-between gap-1">
                                  <select
                                    value={lead.status}
                                    onChange={(e) => handleUpdateLeadStatus(lead.id, e.target.value)}
                                    className="bg-[#080C14] text-[10px] text-slate-300 border border-slate-700 rounded px-1.5 py-1 focus:outline-none"
                                  >
                                    {PIPELINE_STAGES.map(s => (
                                      <option key={s.id} value={s.id}>{s.label}</option>
                                    ))}
                                  </select>

                                  <div className="flex items-center gap-1">
                                    <a
                                      href={getWhatsAppLink(lead.phone, lead.businessName)}
                                      target="_blank"
                                      rel="noreferrer"
                                      className="p-1 rounded bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs"
                                      title="WhatsApp Chat"
                                    >
                                      <i data-lucide="message-square" className="w-3.5 h-3.5"></i>
                                    </a>
                                    <button
                                      onClick={() => setActiveLogLead(lead)}
                                      className="p-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs"
                                      title="Activity Logs"
                                    >
                                      <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                                    </button>
                                  </div>
                                </div>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* View Tab 3: Directory */}
              {activeTab === 'directory' && (
                <div className="bg-[#0F172A] border border-slate-800 rounded-xl overflow-hidden shadow-sm">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="bg-[#080C14] text-slate-400 uppercase font-mono border-b border-slate-800">
                        <tr>
                          <th className="p-3.5">Business Name</th>
                          <th className="p-3.5">Contact Person</th>
                          <th className="p-3.5">Phone / WhatsApp</th>
                          <th className="p-3.5">Industry</th>
                          <th className="p-3.5">Status</th>
                          <th className="p-3.5">Est. Budget</th>
                          <th className="p-3.5">Follow-Up</th>
                          <th className="p-3.5 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800">
                        {filteredLeads.map(lead => (
                          <tr key={lead.id} className="hover:bg-slate-800/40 transition">
                            <td className="p-3.5 font-semibold text-slate-100">
                              {lead.businessName}
                              <span className="block text-[10px] font-normal text-slate-500">Source: {lead.source}</span>
                            </td>
                            <td className="p-3.5">{lead.contactPerson}</td>
                            <td className="p-3.5 font-mono text-cyan-400">+91 {lead.phone}</td>
                            <td className="p-3.5">
                              <span className="px-2 py-0.5 rounded bg-slate-800 border border-slate-700">
                                {lead.industry}
                              </span>
                            </td>
                            <td className="p-3.5">
                              <span className={`px-2 py-0.5 rounded font-medium border ${PIPELINE_STAGES.find(s => s.id === lead.status)?.color || ''}`}>
                                {lead.status}
                              </span>
                            </td>
                            <td className="p-3.5 font-semibold text-emerald-400">₹{(Number(lead.value) || 0).toLocaleString('en-IN')}[cite: 1]</td>
                            <td className="p-3.5 font-mono text-slate-400">
                              {lead.nextFollowUp || '—'}
                            </td>
                            <td className="p-3.5 text-right space-x-1">
                              <a
                                href={getWhatsAppLink(lead.phone, lead.businessName)}
                                target="_blank"
                                rel="noreferrer"
                                className="inline-block p-1.5 rounded bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30"
                              >
                                <i data-lucide="message-square" className="w-3.5 h-3.5"></i>
                              </a>
                              <button
                                onClick={() => setActiveLogLead(lead)}
                                className="p-1.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300"
                              >
                                <i data-lucide="file-text" className="w-3.5 h-3.5"></i>
                              </button>
                              <button
                                onClick={() => { setEditingLead(lead); setIsAddLeadOpen(true); }}
                                className="p-1.5 rounded bg-slate-800 hover:bg-slate-700 text-cyan-400"
                              >
                                <i data-lucide="edit-2" className="w-3.5 h-3.5"></i>
                              </button>
                              <button
                                onClick={() => handleDeleteLead(lead.id)}
                                className="p-1.5 rounded bg-rose-500/10 hover:bg-rose-500/20 text-rose-400"
                              >
                                <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* Modal 1: Add or Edit Lead Modal */}
          {isAddLeadOpen && (
            <LeadModal
              lead={editingLead}
              onClose={() => { setIsAddLeadOpen(false); setEditingLead(null); }}
              onSave={handleSaveLead}
            />
          )}

          {/* Modal 2: Activity Logs Modal */}
          {activeLogLead && (
            <ActivityLogModal
              lead={activeLogLead}
              logs={logs.filter(l => l.leadId === activeLogLead.id)}
              onClose={() => setActiveLogLead(null)}
              onAddLog={(logData) => handleAddLog(activeLogLead.id, logData)}
            />
          )}
        </div>
      );
    }

    function LeadModal({ lead, onClose, onSave }) {
      const [formData, setFormData] = useState(lead || {
        businessName: '',
        contactPerson: '',
        phone: '',
        industry: 'Education',
        status: 'New Lead',
        source: 'Cold Visit',
        value: '',
        nextFollowUp: '',
        notes: ''
      });

      const [errorMsg, setErrorMsg] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.businessName || !formData.phone) {
          setErrorMsg('Please complete both Business Name and Phone field.');
          return;
        }
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#0F172A] border border-slate-800 w-full max-w-lg rounded-xl shadow-2xl overflow-hidden flex flex-col">
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <h3 className="font-bold text-slate-100">{lead ? 'Edit Business Lead' : 'Add New Local Business Lead'}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs overflow-y-auto max-h-[80vh]">
              {errorMsg && (
                <div className="p-2.5 rounded bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs">
                  {errorMsg}
                </div>
              )}

              <div>
                <label className="block text-slate-400 mb-1">Business / Firm Name *</label>
                <input
                  type="text"
                  required
                  placeholder="e.g. Jind Fitness Club"
                  value={formData.businessName}
                  onChange={e => setFormData({ ...formData, businessName: e.target.value })}
                  className="w-full bg-[#080C14] border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 mb-1">Contact Person</label>
                  <input
                    type="text"
                    placeholder="Owner / Director"
                    value={formData.contactPerson}
                    onChange={e => setFormData({ ...formData, contactPerson: e.target.value })}
                    className="w-full bg-[#080C14] border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">WhatsApp / Phone *</label>
                  <input
                    type="text"
                    required
                    placeholder="9812345678"
                    value={formData.phone}
                    onChange={e => setFormData({ ...formData, phone: e.target.value })}
                    className="w-full bg-[#080C14] border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 mb-1">Industry</label>
                  <select
                    value={formData.industry}
                    onChange={e => setFormData({ ...formData, industry: e.target.value })}
                    className="w-full bg-[#080C14] border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                  >
                    {INDUSTRIES.map(i => <option key={i} value={i}>{i}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">Pipeline Stage</label>
                  <select
                    value={formData.status}
                    onChange={e => setFormData({ ...formData, status: e.target.value })}
                    className="w-full bg-[#080C14] border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                  >
                    {PIPELINE_STAGES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 mb-1">Lead Source</label>
                  <select
                    value={formData.source}
                    onChange={e => setFormData({ ...formData, source: e.target.value })}
                    className="w-full bg-[#080C14] border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                  >
                    {SOURCES.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">Estimated Value (₹)[cite: 1]</label>
                  <input
                    type="number"
                    placeholder="35000"
                    value={formData.value}
                    onChange={e => setFormData({ ...formData, value: e.target.value })}
                    className="w-full bg-[#080C14] border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="block text-slate-400 mb-1">Next Follow-Up Date</label>
                <input
                  type="date"
                  value={formData.nextFollowUp || ''}
                  onChange={e => setFormData({ ...formData, nextFollowUp: e.target.value })}
                  className="w-full bg-[#080C14] border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                />
              </div>

              <div>
                <label className="block text-slate-400 mb-1">Project Requirements / Notes</label>
                <textarea
                  rows="3"
                  placeholder="Key features requested, custom app requirements..."
                  value={formData.notes}
                  onChange={e => setFormData({ ...formData, notes: e.target.value })}
                  className="w-full bg-[#080C14] border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:border-cyan-500 focus:outline-none"
                ></textarea>
              </div>

              <div className="pt-3 flex justify-end gap-2 border-t border-slate-800">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg font-medium"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-cyan-500 hover:bg-cyan-400 text-slate-950 rounded-lg font-bold"
                >
                  Save Lead
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function ActivityLogModal({ lead, logs, onClose, onAddLog }) {
      const [type, setType] = useState('In-Person Meeting');
      const [summary, setSummary] = useState('');

      const handleAdd = (e) => {
        e.preventDefault();
        if (!summary.trim()) return;
        onAddLog({ type, summary });
        setSummary('');
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#0F172A] border border-slate-800 w-full max-w-md rounded-xl shadow-2xl overflow-hidden flex flex-col">
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <div>
                <h3 className="font-bold text-slate-100">{lead.businessName}</h3>
                <p className="text-xs text-slate-400">Interaction & Call History</p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white"><i data-lucide="x" className="w-5 h-5"></i></button>
            </div>

            <div className="p-4 space-y-4 text-xs overflow-y-auto max-h-[60vh]">
              <form onSubmit={handleAdd} className="space-y-2 bg-[#080C14] p-3 rounded-lg border border-slate-800">
                <div className="flex items-center justify-between gap-2">
                  <span className="font-semibold text-slate-300">Log New Interaction:</span>
                  <select
                    value={type}
                    onChange={e => setType(e.target.value)}
                    className="bg-[#0F1F2A] border border-slate-700 rounded px-2 py-1 text-slate-200"
                  >
                    <option value="In-Person Meeting">In-Person Meeting</option>
                    <option value="WhatsApp">WhatsApp Chat</option>
                    <option value="Phone Call">Phone Call</option>
                    <option value="Email">Email</option>
                  </select>
                </div>
                <textarea
                  rows="2"
                  placeholder="Summary of meeting or decision..."
                  value={summary}
                  onChange={e => setSummary(e.target.value)}
                  className="w-full bg-[#0F172A] border border-slate-700 rounded p-2 text-slate-200 focus:outline-none"
                ></textarea>
                <button
                  type="submit"
                  className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-1.5 rounded transition"
                >
                  Record Entry
                </button>
              </form>

              <div className="space-y-2">
                <h4 className="font-semibold text-slate-400 text-[11px] uppercase tracking-wider">History</h4>
                {logs.length === 0 ? (
                  <p className="text-slate-500 italic text-center py-4">No activity logged yet.</p>
                ) : (
                  logs.map(log => (
                    <div key={log.id} className="p-2.5 bg-[#080C14] border border-slate-800 rounded-lg space-y-1">
                      <div className="flex items-center justify-between text-slate-400">
                        <span className="font-semibold text-cyan-400">{log.type}</span>
                        <span className="font-mono text-[10px]">{log.date}</span>
                      </div>
                      <p className="text-slate-300">{log.summary}</p>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
